repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        types: [yaml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        args: [--strict]
        additional_dependencies:
          - ansible~=14.5

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -recursive
        language: system
        pass_filenames: false
        types: [terraform]

      - id: tofu-validate
        name: tofu validate
        entry: bash -c 'set -euo pipefail; for root in terraform/boundaries/core-infra terraform/boundaries/github; do (cd "$root" && tofu init -backend=false -input=false && tofu validate); done'
        language: system
        pass_filenames: false
        types: [terraform]

      - id: ansible-syntax
        name: ansible syntax
        language: python
        language_version: python3.14
        additional_dependencies:
          - ansible~=14.5
        entry: bash scripts/ansible-syntax-check.sh
        pass_filenames: false
        files: ^ansible/
