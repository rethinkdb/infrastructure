- name: Install python dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-dev
      - python3-pip
      - python3-virtualenv
    state: present

- name: Ensure update checker user exists
  ansible.builtin.user:
    name: update-checker
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Ensure update checker path exists
  ansible.builtin.file:
    path: "{{ UPDATE_CHECKER_PATH }}"
    state: directory
    owner: update-checker
    group: update-checker
    mode: "0755"

- name: Ensure update checker tree is owned by the service user
  ansible.builtin.file:
    path: "{{ UPDATE_CHECKER_PATH }}"
    state: directory
    owner: update-checker
    group: update-checker
    recurse: true

- name: Download update checker
  become: true
  become_user: update-checker
  ansible.builtin.git:
    repo: "{{ UPDATE_CHECKER_REPO }}"
    dest: "{{ UPDATE_CHECKER_PATH }}"
    version: "{{ UPDATE_CHECKER_VERSION }}"
  notify: Restart update checker

- name: Install requirements
  become: true
  become_user: update-checker
  ansible.builtin.pip:
    virtualenv: "{{ UPDATE_CHECKER_PATH }}/venv"
    extra_args: --no-build-isolation
    requirements: "{{ UPDATE_CHECKER_PATH }}/requirements.txt"
  notify: Restart update checker

- name: Install update checker service
  ansible.builtin.template:
    src: rethinkdb-update.service.j2
    dest: /etc/systemd/system/rethinkdb-update.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart update checker

- name: Ensure update checker is running and enabled
  ansible.builtin.systemd_service:
    name: rethinkdb-update
    state: started
    enabled: true
    daemon_reload: true
